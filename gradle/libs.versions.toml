# ライブラリとプラグインのバージョンは、このファイルにだけ書く。ただし foojay の resolver は settings.gradle.kts に書く（settings の plugins では version catalog を使えないため）。
# Spring Boot の BOM が管理するライブラリは、バージョンを書かずに BOM に任せる（build-logic の kotlin-conventions が全モジュールに BOM を入れる）

[versions]
kotlin = "2.3.21"
spring-boot = "4.1.3"
kotest = "6.2.7"
detekt = "2.0.0-alpha.6"
ktlint-gradle = "14.2.0"
ktlint = "1.8.0"
# jOOQ のコード生成と Flyway の Gradle プラグインは、Spring Boot の BOM が管理するライブラリと同じバージョンにそろえる
jooq = "3.21.9"
flyway = "12.4.0"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-jooq = { module = "org.springframework.boot:spring-boot-starter-jooq" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test" }
spring-context = { module = "org.springframework:spring-context" }
spring-webmvc = { module = "org.springframework:spring-webmvc" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
jooq = { module = "org.jooq:jooq" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc" }
flyway-core = { module = "org.flywaydb:flyway-core" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-extensions-spring = { module = "io.kotest:kotest-extensions-spring", version.ref = "kotest" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooq" }
flyway = { id = "org.flywaydb.flyway", version.ref = "flyway" }
